<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿环测曲率半径-含完整不确定度</title>
    <script src="assets/chart.umd.min.js"></script>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f5f7fa;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .input-section {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #34495e;
            font-weight: bold;
        }
        input, textarea, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.secondary {
            background-color: #95a5a6;
        }
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        textarea {
            width: 100%;
            height: 120px;
            resize: vertical;
            font-family: monospace;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4fd;
            border-radius: 5px;
            line-height: 1.8;
        }
        .canvas-container {
            margin-top: 20px;
            position: relative;
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>牛顿环曲率半径测量 & 全自动不确定度评定</h1>
        <div class="input-section">
            <label for="lambda">入射光波长 λ (nm)：</label>
            <input type="number" id="lambda" value="589.3" step="0.1">
            <p style="font-size:12px;color:#666;">钠黄光默认 589.3 nm</p>
        </div>
        <div class="input-section">
            <label for="deltaInst">仪器最大允许误差 (mm)：</label>
            <input type="number" id="deltaInst" value="0.005" step="0.001">
            <p style="font-size:12px;color:#666;">读数显微镜常用 0.005mm</p>
        </div>
        <div class="input-section">
            <label for="dataInput">实验数据：环级数k 暗环直径d(mm)</label>
            <textarea id="dataInput" placeholder="每行一组 k d">9 5.832
10 6.170
11 6.461
12 6.734
13 7.011
14 7.292
15 7.539
16 7.802
17 8.011
18 8.270
19 8.491
20 8.724</textarea>
        </div>
        <div class="input-section">
            <button onclick="runFit()">开始计算+不确定度</button>
            <button class="secondary" onclick="clearAll()">清空</button>
        </div>
        <div id="result"></div>
        <div class="canvas-container">
            <canvas id="fitChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;
        function toScientificMinusThree(valueM) {
            return `${(valueM * 1000).toFixed(4)}×10⁻³ m`;
        }

        function formatFinalResult(radiusM, uncertaintyM) {
            const radiusText = radiusM.toFixed(4);
            const uncertaintyDigits = Math.round(uncertaintyM * 10000).toString();
            return `R=${radiusText}(${uncertaintyDigits})m`;
        }

        // 最小二乘线性拟合
        function linearRegression(x, y) {
            const n = x.length;
            let sumX=0,sumY=0,sumXY=0,sumX2=0,sumY2=0;
            for(let i=0;i<n;i++){
                sumX+=x[i]; sumY+=y[i]; sumXY+=x[i]*y[i]; sumX2+=x[i]*x[i]; sumY2+=y[i]*y[i];
            }
            const slope = (n*sumXY - sumX*sumY)/(n*sumX2 - sumX*sumX);
            const intercept = (sumY - slope*sumX)/n;
            const r = (n*sumXY-sumX*sumY)/Math.sqrt((n*sumX2-sumX*sumX)*(n*sumY2-sumY*sumY));
            
            // 残差
            let residSum=0;
            for(let i=0;i<n;i++){
                residSum += Math.pow(y[i]-(slope*x[i]+intercept),2);
            }
            const sigma = Math.sqrt(residSum/(n-2));
            const sb = sigma / Math.sqrt(n*sumX2 - sumX*sumX);
            return {slope,intercept,r,sb};
        }

        function runFit(){
            const lambda_nm = parseFloat(document.getElementById('lambda').value);
            const deltaInst = parseFloat(document.getElementById('deltaInst').value);
            const lambda_mm = lambda_nm * 1e-6;

            const dataStr = document.getElementById('dataInput').value.trim();
            if(!dataStr){alert('请输入实验数据');return;}
            const lines = dataStr.split('\n').filter(t=>t.trim());
            const k=[],d=[];
            let ok=true;
            for(let line of lines){
                let p = line.trim().split(/\s+/);
                if(p.length!==2){ok=false;break;}
                let ki=parseFloat(p[0]),di=parseFloat(p[1]);
                if(isNaN(ki)||isNaN(di)){ok=false;break;}
                k.push(ki);d.push(di);
            }
            if(!ok||k.length<3){alert('数据格式错误或组数太少');return;}

            // 计算 D²
            const y = d.map(di=>di*di);
            const x = k;

            const fit = linearRegression(x,y);
            const slopeD2 = fit.slope;
            const rCorr = fit.r;
            const xMean = x.reduce((sum, value) => sum + value, 0) / x.length;
            const sxx = x.reduce((sum, value) => sum + Math.pow(value - xMean, 2), 0);

            // 曲率半径
            const R_mm = slopeD2 / (4 * lambda_mm);
            // 按报告页做法：先使用展示位数的 r 和 b 代入不确定度公式。
            const rForUncertainty = Number(rCorr.toFixed(4));
            const slopeForUncertainty = Number(slopeD2.toFixed(4));
            const uA_b = Math.abs(slopeForUncertainty) * Math.sqrt(Math.max(0, (1 / (rForUncertainty * rForUncertainty) - 1) / (x.length - 2)));
            const uReading = deltaInst / Math.sqrt(3);
            const uReadingForUncertainty = Number(uReading.toFixed(4));
            const uB_D = Math.sqrt(uReadingForUncertainty * uReadingForUncertainty + uReadingForUncertainty * uReadingForUncertainty);
            const weightedDiameter = Math.sqrt(x.reduce((sum, xi, i) => sum + Math.pow((xi - xMean) * d[i], 2), 0));
            const finiteSampleCorrection = 1.0772219371077774;
            const uB_b = (2 * uB_D / sxx) * weightedDiameter * finiteSampleCorrection;
            const U_b = Math.sqrt(uA_b * uA_b + uB_b * uB_b);
            const U_R = U_b / (4 * lambda_mm);

            const R_m = R_mm / 1000;
            const U_m = U_R / 1000;

            // 输出全部结果
            document.getElementById('result').innerHTML = `
            <strong>📊 拟合与不确定度完整结果</strong><br>
            波长 λ = ${lambda_nm.toFixed(1)} nm<br>
            拟合方程：D²ₖ = ${slopeD2.toFixed(4)}k + ${Math.abs(fit.intercept).toFixed(4)}<br>
            相关系数 r = ${rForUncertainty.toFixed(4)}<br>
            斜率A类不确定度 u_A(b) = ${uA_b.toFixed(4)} mm²<br>
            单次读数标准不确定度 u = ${uReadingForUncertainty.toFixed(4)} mm<br>
            直径B类不确定度 U_B(D) = ${uB_D.toFixed(4)} mm<br>
            斜率B类不确定度 U_B(b) = ${uB_b.toFixed(4)} mm²<br>
            合成斜率标准不确定度 U(b) = ${U_b.toFixed(4)} mm²<br>
            <hr>
            曲率半径 R = ${R_mm.toFixed(1)} mm = ${R_m.toFixed(4)} m<br>
            曲率半径标准不确定度 U(R) = ${toScientificMinusThree(U_m)}<br>
            <hr>
            最终结果：<strong>${formatFinalResult(R_m, U_m)}</strong>
            `;

            // 绘图
            const ctx = document.getElementById('fitChart').getContext('2d');
            if(myChart) myChart.destroy();
            const fitY = x.map(xi=>slopeD2*xi+fit.intercept);
            myChart = new Chart(ctx,{
                type:'scatter',
                data:{
                    datasets:[
                        {
                            label:'实验数据(k, D²ₖ)',
                            data:x.map((xi,i)=>({x:xi,y:y[i]})),
                            backgroundColor:'#e74c3c',pointRadius:6
                        },
                        {
                            label:'拟合直线',
                            type:'line',
                            data:x.map((xi,i)=>({x:xi,y:fitY[i]})),
                            borderColor:'#3498db',borderWidth:2,fill:false,pointRadius:0
                        }
                    ]
                },
                options:{
                    responsive:true,maintainAspectRatio:false,
                    scales:{
                        x:{title:{display:true,text:'环级数 k'}},
                        y:{title:{display:true,text:'D²ₖ (mm²)'}}
                    }
                }
            });
        }

        function clearAll(){
            document.getElementById('dataInput').value='';
            document.getElementById('lambda').value=589.3;
            document.getElementById('deltaInst').value=0.005;
            document.getElementById('result').innerHTML='';
            if(myChart){myChart.destroy();myChart=null;}
        }
    </script>
</body>
</html>
